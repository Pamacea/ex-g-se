[package]
name = "ex-g-se"
version = "0.5.6"
edition = "2021"
description = "EX-G-SE: Shadow Logging Core Engine with AI Analysis"
authors = ["EX-G-SE Team"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"

# Clipboard monitoring
arboard = "3"

# Serialization
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Image processing
image = { version = "0.25", features = ["png"] }

# HTTP client for AI provider APIs
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "1"

# Async trait support
async-trait = "0.1"

# UUID for session IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# Home directory detection
dirs = "5"

# Platform-specific dependencies (macOS and Windows only - Linux support removed due to system dependencies)
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
core-graphics = "0.23"
objc = "0.2"
cocoa = "0.25"
rdev = { git = "https://github.com/Narsil/rdev", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
notify = "6"
winapi = { version = "0.3", features = ["winuser", "wingdi"] }
rdev = { git = "https://github.com/Narsil/rdev", default-features = false }

[dev-dependencies]
# For testing
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
