[package]
name = "ex-g-se"
version = "0.3.0"
edition = "2021"
description = "EX-G-SE: Shadow Logging Core Engine with AI Analysis"
authors = ["EX-G-SE Team"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"

# Clipboard monitoring
arboard = "3"

# Keyboard hooks
device_query = "2"

# Serialization
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Image processing
image = { version = "0.25", features = ["png"] }

# HTTP client for AI provider APIs
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "1"

# Async trait support
async-trait = "0.1"

# UUID for session IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# File system watching - platform-specific to avoid x11rb dependency
[target.'cfg(not(target_os = "linux"))'.dependencies]
notify = "6"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
objc = "0.2"
cocoa = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi"] }

[dev-dependencies]
# For testing
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
