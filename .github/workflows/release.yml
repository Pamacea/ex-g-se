name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: ex-g-se-macos-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: ex-g-se-win.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --manifest-path=core/Cargo.toml --target ${{ matrix.target }}

      - name: Create dist directory
        run: mkdir -p dist

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp core/target/${{ matrix.target }}/release/ex-g-se dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          copy core\target\${{ matrix.target }}\release\ex-g-se.exe dist\${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish NPM
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Organize binaries
        run: |
          mkdir -p bin
          find binaries -type f -name "ex-g-se-*" ! -name "*.exe" -exec cp {} bin/ \;
          find binaries -type f -name "ex-g-se-win*" -exec cp {} bin/ \;
          chmod +x bin/* 2>/dev/null || true
          ls -la bin/

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
